<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>SIDE QUEST</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
:root{--bg:#0D0D0F;--tx:#F2F0EA;--lime:#B8FF2C;--dk:#252529;--blue:#4D7CFF;--rc:#B8FF2C;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:'Space Grotesk',system-ui,sans-serif}
body{display:flex;justify-content:center}
#app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;font-size:11px}
.top{display:flex;justify-content:space-between;padding:16px 22px 0}
.chip{background:var(--dk);border-radius:99px;padding:8px 12px;color:var(--tx)}
.chip b{color:var(--lime);font-weight:500}
.screen{flex:1;display:none;flex-direction:column;align-items:center;padding:0 22px;min-height:0}
.screen.on{display:flex;animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.logo{width:min(46vw,190px);background:var(--lime);border-radius:26px;padding:8px;margin-top:5vh}
.logo img{display:block;width:100%;mix-blend-mode:multiply}
.tag{margin-top:16px;color:#8b8b90}
.spacer{flex:1}
.cta{width:100%;border:0;border-radius:22px;background:var(--lime);color:#0D0D0F;font:700 clamp(22px,7vw,28px)/1.1 inherit;font-family:inherit;padding:30px 16px;box-shadow:0 6px 0 #6f9a10;transition:transform .12s,box-shadow .12s;cursor:pointer}
.cta:active,.cta.press{transform:translateY(5px) scale(.98);box-shadow:0 1px 0 #6f9a10}
.cta.ghost{background:transparent;color:var(--tx);box-shadow:none;border:1px solid var(--dk);padding:16px;font-size:14px;font-weight:500;margin-top:10px}
.foot{width:100%;padding-bottom:18px}
.streak{text-align:center;margin-bottom:16px;color:#8b8b90}.streak b{color:var(--lime);font-weight:500}
.card{width:100%;margin:auto 0;background:#151518;border:1px solid var(--dk);border-radius:20px;padding:24px 22px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--rc)}
.card .row{display:flex;justify-content:space-between;align-items:center}
.card .lbl{color:#8b8b90}
.rar{color:var(--rc);border:1px solid var(--rc);border-radius:99px;padding:5px 10px}
.card h2{font-size:clamp(30px,10vw,40px);line-height:1;margin:26px 0 16px;letter-spacing:-.02em;text-transform:uppercase}
.card p{font-size:19px;line-height:1.4;margin:0 0 26px;color:#e4e2dc}
.xp{color:var(--rc);font-size:15px;font-weight:700;letter-spacing:.08em}
.card.reveal{animation:rev .45s cubic-bezier(.2,1.2,.4,1) both}
@keyframes rev{from{opacity:0;transform:scale(.92) translateY(14px)}to{opacity:1;transform:none}}
.gen{margin:auto 0;text-align:center;color:var(--lime)}
.gen .bar{width:180px;height:4px;background:var(--dk);margin:16px auto 0;border-radius:4px;overflow:hidden}
.gen .bar i{display:block;height:100%;width:0;background:var(--lime);animation:load .9s linear forwards}
@keyframes load{to{width:100%}}
.log{width:100%;overflow:auto;padding:16px 0}
.log h3{margin:0 0 14px;font-size:24px}
.it{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--dk)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.it div{flex:1;min-width:0}.it small{color:#8b8b90;display:block;margin-top:3px}
.it span{font-weight:700;font-size:13px}
.empty{color:#8b8b90;text-align:center;margin-top:60px}
nav{display:flex;border-top:1px solid var(--dk);padding-bottom:6px}
nav button{flex:1;background:none;border:0;color:#6d6d72;padding:16px 0;font-family:inherit;cursor:pointer}
nav button.on{color:var(--lime)}
#done{position:absolute;inset:0;background:rgba(13,13,15,.94);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:5}
#done.on{display:flex;animation:in .2s both}
#done .ck{width:96px;height:96px;border-radius:50%;background:var(--lime);display:grid;place-items:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
#done .ck svg{width:48px;stroke:#0D0D0F;stroke-width:4;fill:none;stroke-dasharray:40;stroke-dashoffset:40;animation:dr .4s .2s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
#done .plus{margin-top:22px;font-size:44px;font-weight:700;color:var(--lime);animation:up .7s .3s both}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}
@media(max-height:640px){.logo{width:34vw;margin-top:2vh}.card h2{margin:16px 0 10px}.card p{font-size:17px;margin-bottom:16px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}

.seg{display:flex;width:100%;background:var(--dk);border-radius:14px;padding:4px;margin:6px 0 14px}
.seg button{flex:1;border:0;background:none;color:#8b8b90;font-family:inherit;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:12px 0;border-radius:10px;cursor:pointer;transition:background .15s,color .15s}
.seg button.on{background:var(--lime);color:#0D0D0F;font-weight:700}
.dlbl{width:100%;color:#8b8b90;margin-bottom:0}
#ok{display:flex;align-items:center;justify-content:center;gap:12px;padding:24px 16px;font-size:22px;text-transform:uppercase;letter-spacing:.04em}
#ok svg{width:28px;stroke:#0D0D0F;stroke-width:3.5;fill:none}
#skip{width:auto;margin:14px auto 0;display:block;border:0;color:#8b8b90;text-decoration:underline;text-underline-offset:4px;padding:8px 14px}
.pc{position:absolute;left:50%;top:40%;width:9px;height:14px;background:var(--pc);opacity:0;animation:fly .95s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.ring{position:absolute;left:50%;top:40%;width:96px;height:96px;margin:-48px 0 0 -48px;border:3px solid var(--rc,var(--lime));border-radius:50%;opacity:0;animation:ring .9s ease-out forwards}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(5);opacity:0}}
#done .ck{box-shadow:0 0 0 0 var(--rc,var(--lime));animation:pop .5s cubic-bezier(.2,1.6,.4,1) both,glow 1s .3s ease-out}
@keyframes glow{from{box-shadow:0 0 0 0 var(--rc,#B8FF2C)}to{box-shadow:0 0 0 40px transparent}}

.stars{color:var(--lime);letter-spacing:.1em;font-size:16px}
.proofrow{color:#8b8b90;margin-top:14px;line-height:1.6;text-transform:none;letter-spacing:.05em}
.pw{width:100%;padding-top:20px;overflow:auto;flex:1}.pw h2{font-size:clamp(28px,9vw,38px);margin:10px 0 6px;text-transform:uppercase;line-height:1}
.big{font-size:64px;font-weight:700;text-align:center;margin:30px 0 14px;font-variant-numeric:tabular-nums;color:var(--lime)}
.bar2{height:6px;background:var(--dk);border-radius:6px;overflow:hidden}.bar2 i{display:block;height:100%;width:0;background:var(--lime)}
.note{color:#8b8b90;font-size:13px;line-height:1.5;margin:14px 0}
.pv{background:var(--dk);border-radius:16px;min-height:180px;display:grid;place-items:center;color:#8b8b90;text-align:center;padding:16px;margin:20px 0 14px;overflow:hidden}.pv img{width:100%;border-radius:12px;display:block}
.box{border:1px dashed #8b8b90;border-radius:14px;padding:16px;margin:24px 0 12px;line-height:1.5}
.pw .cta{margin-top:10px}.cta:disabled{opacity:.35;box-shadow:none}
.dim{color:#8b8b90;margin:14px 0 6px}.code{font:700 26px ui-monospace,monospace;color:var(--lime);letter-spacing:.12em}
input{width:100%;background:var(--dk);border:0;border-radius:12px;color:var(--tx);padding:14px;font:inherit;margin-bottom:8px}
.dsub{color:#8b8b90;text-align:center;margin:12px 0;text-transform:none;letter-spacing:.05em}
.tg{font-size:10px;padding:2px 7px;border-radius:99px;border:1px solid;margin-left:8px}
.thumb{width:40px;height:40px;border-radius:8px;object-fit:cover}
</style>

["TRAMONTO","Guarda il tramonto dall'inizio alla fine senza telefono.","f"],
["POSTO TRANQUILLO","Siediti in un posto tranquillo la sera e osserva per 10 minuti.","m"],
["DIARIO DEI SOGNI","Al risveglio scrivi cosa ricordi del sogno di stanotte.","d"],
["LA LUNA","Cerca la luna e fotografala.","f"]]),
...C('courage',[
["PRIMA MOSSA","Fai il primo passo con una persona con cui vorresti parlare di più.","d"],
["DILLO","Dì ad alta voce una cosa che pensi ma non dici mai.","d"],
["CHIEDI E BASTA","Chiedi una cosa che di solito non chiederesti, tipo un'info o uno sconto.","m"],
["SUL PALCO","Canta o suona qualcosa davanti a una persona.","d"],
["DI' DI NO","Dì di no a qualcosa che non ti va di fare.","m"],
["MOSTRALO","Mostra a qualcuno una cosa che hai creato.","m"],
["MODALITÀ SOLO","Vai da solo in un posto dove di solito andresti in compagnia.","d"],
["FAI PACE","Se hai qualcosa in sospeso con qualcuno, scrivigli o chiedi scusa.","d"],
["LA TUA OPINIONE","Dì la tua opinione onesta in un gruppo dove di solito stai zitto.","d"],
["NUOVA FACCIA","Presentati a una persona nuova.","d"],
["SGUARDO DIRETTO","Guarda negli occhi chi ti parla per tutta una conversazione.","m"]])
].map((q,i)=>({...q,id:i}));

/* ========== 2. PROOF TYPE + DIFFICOLTÀ (per quest, stesso ordine dell array) ========== */
const PROOF=("L300 L200 P L200 P P L400 L300 P T30 L500 H H H H H H H H H H H H "+
"P P P P H P T5 T10 P P P P P H T10 T30 H P T10 T4 P H "+
"P H H L500 P H T60 H T2 T5 H P T5 P T5 T10 T15 T5 T30 P T15 H "+
"T20 T3 H T5 T2 T20 T2 T1 L1000 L2000 T10 T20 T5 P H T30 P H T15 T10 H P "+
"H H H H H H L300 H H H H").split(" ");
QUESTS.forEach((q,i)=>{const p=PROOF[i]||"H",k=p[0],n=+p.slice(1)||0;
 q.proof={L:"LOCATION",T:"TIMER",P:"PHOTO",H:"HONOR"}[k];q.req=k==="T"?n*60:n;
 q.lvl=q.l==="f"?(i%2?2:1):q.l==="m"?3:(i%2?5:4)});

/* ========== 3. STORAGE ========== */
const Store={k:"sidequest.v2",pk:"sidequest.photos",
 def:()=>({xp:0,done:0,st:{c:0,b:0,last:null},vs:{c:0,b:0,last:null},daily:null,recent:[],log:[],outbox:[],friends:[],code:null}),
 load(){try{const r=localStorage.getItem(this.k);if(r)return{...this.def(),...JSON.parse(r)};
  const o=JSON.parse(localStorage.getItem("sidequest.v1")||"null"),d=this.def();if(o){d.xp=o.xp||0;d.done=o.done||0}return d}catch(e){return this.def()}},
 save(s){try{localStorage.setItem(this.k,JSON.stringify(s))}catch(e){}},
 photos(){try{return JSON.parse(localStorage.getItem(this.pk)||"{}")}catch(e){return{}}},
 savePhoto(id,u){try{const p=this.photos();p[id]=u;const ks=Object.keys(p);while(ks.length>25)delete p[ks.shift()];localStorage.setItem(this.pk,JSON.stringify(p));return true}catch(e){return false}}};

/* ========== 4. QUEST ENGINE ========== */
const RARITY=[{n:"COMMON",xp:20,w:50,c:"#A0A0A0"},{n:"UNCOMMON",xp:40,w:28,c:"#B8FF2C"},{n:"RARE",xp:75,w:14,c:"#4D7CFF"},{n:"EPIC",xp:150,w:6,c:"#A855F7"},{n:"LEGENDARY",xp:300,w:2,c:"#FFB020"}];
const R=n=>RARITY.find(r=>r.n===n);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const Rand={rarity(){let r=Math.random()*100;for(const x of RARITY){if((r-=x.w)<0)return x}return RARITY[0]},
 any(rc){const p=QUESTS.filter(q=>!rc.includes(q.id));return pick(p.length?p:QUESTS)},
 daily(rc){const lv=1+Math.floor(Math.random()*5);let p=QUESTS.filter(q=>q.lvl===lv&&!rc.includes(q.id));if(!p.length)p=QUESTS.filter(q=>!rc.includes(q.id));return pick(p.length?p:QUESTS)}};

/* ========== 5. STREAK + XP ENGINE ========== */
const day=(d=new Date())=>d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
const yday=()=>{const y=new Date();y.setDate(y.getDate()-1);return day(y)};
const Streak={cur:o=>(o.last===day()||o.last===yday())?o.c:0,
 hit(o){const t=day();if(o.last===t)return;o.c=o.last===yday()?o.c+1:1;o.b=Math.max(o.b,o.c);o.last=t}};
const XP={add:(s,n)=>{s.xp+=n;s.done++}};

/* ========== 6. PROOF ENGINE ========== */
const Proof={label:{TIMER:"Timer",PHOTO:"Foto",LOCATION:"Posizione",HONOR:"Honor system"},
 verified:p=>p!=="HONOR",
 timerLeft(d){const e=Math.max(0,Date.now()-d.startedAt);return Math.max(0,d.req*1000-e)},
 dist(a,b){const Re=6371000,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dn=r(b.lon-a.lon),h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2;return 2*Re*Math.asin(Math.sqrt(h))},
 pos(){return new Promise((ok,no)=>{if(!navigator.geolocation)return no();navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lon:p.coords.longitude}),no,{enableHighAccuracy:true,timeout:10000})})},
 shrink(f){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",.7))};im.onerror=no;im.src=u})}};

/* ========== 7. SYNC LAYER (pronto per un futuro backend) ========== */
const Sync={queue(s,ev){const eid=ev.date+"#"+ev.questId+"#"+ev.type;if(!s.outbox.some(e=>e.eid===eid))s.outbox.push({...ev,eid,synced:false})},
 pending:s=>s.outbox.filter(e=>!e.synced).length,
 async flush(){/* TODO: inviare outbox al server; il server sarà la fonte autorevole per la classifica */return 0}};

/* ========== 8. FRIEND ENGINE ========== */
const Friends={code(s){if(!s.code){s.code="SQ-"+Math.random().toString(36).slice(2,7).toUpperCase();Store.save(s)}return s.code},
 add(s,c,n){c=c.trim().toUpperCase();if(!/^SQ-[A-Z0-9]{5}$/.test(c)||c===s.code||s.friends.some(f=>f.code===c))return false;s.friends.push({code:c,name:n.trim()||c,streak:null,best:null});return true}};

/* ========== 9. UI ========== */
const $=id=>document.getElementById(id),esc=s=>s.replace(/[&<>"]/g,c=>"&#"+c.charCodeAt(0)+";");
const stars=n=>"★".repeat(n)+"☆".repeat(5-n);
let S=Store.load(),bonus=null,qmode="daily",busy=false,tick=null,watch=null,locOK=false,shot=null;
const dailyState=()=>S.daily&&S.daily.date===day()?S.daily:null;
const pushRecent=id=>{S.recent=[...S.recent,id].slice(-10)};
function stopProof(){clearInterval(tick);if(watch!=null){navigator.geolocation.clearWatch(watch);watch=null}}
function show(id){if(id!=="proof")stopProof();
 document.querySelectorAll(".screen").forEach(e=>e.classList.toggle("on",e.id===id));
 const n=["home","logv","frv"].includes(id)?id:"home";
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===n));
 if(id==="logv")renderLog();if(id==="frv")renderFr();if(id==="home")renderHome()}
function stats(bump){$("xp").textContent=S.xp;$("streak").textContent=Streak.cur(S.st);
 if(bump){$("xp").classList.remove("bump");void $("xp").offsetWidth;$("xp").classList.add("bump")}}
function renderHome(){const d=dailyState(),b=$("daily"),s=$("dsub");b.disabled=false;
 if(!d){b.textContent="Dammi la mia Daily Quest";s.textContent="Una sola al giorno. Non si cambia."}
 else if(d.state==="done"){b.textContent="Daily completata ✓";b.disabled=true;s.textContent="Torna domani per la prossima."}
 else{b.textContent=d.state==="active"?"Continua la Daily":"Vedi la tua Daily";s.textContent=QUESTS[d.id].t}
 stats()}
function animGen(cb){show("gen");const t=["Generating","Scanning","Rolling loot"];let i=0;
 const iv=setInterval(()=>{$("genTxt").textContent=t[i++%3]+"..."},300);setTimeout(()=>{clearInterval(iv);cb()},900)}
function showQuest(mode){qmode=mode;const o=mode==="daily"?S.daily:bonus,q=QUESTS[o.id],r=R(o.r);
 $("card").style.setProperty("--rc",r.c);$("rar").textContent=r.n;$("lbl").textContent=mode==="daily"?"Daily Quest":"Bonus Quest";
 $("qt").textContent=q.t;$("qd").textContent=q.d;$("stars").textContent=stars(q.lvl);$("qxp").textContent="+"+o.xp+" XP";
 let p;
 if(mode==="bonus")p="Bonus: nessuna verifica, non conta per la streak.";
 else{p="Prova: "+Proof.label[o.proof]+(o.proof==="TIMER"?" · "+Math.round(o.req/60)+" min":o.proof==="LOCATION"?" · "+o.req+" m":"");
  if(o.proof==="HONOR")p+="<br>Non verificabile: dà XP ma non conta per la classifica.";
  if(o.proof==="LOCATION")p+="<br>La posizione ti verrà chiesta solo quando premi Inizia, per controllare che ti sposti.";
  if(o.proof==="PHOTO")p+="<br>La foto resta privata sul tuo telefono."}
 $("qproof").innerHTML=p;
 $("ok").innerHTML=mode==="daily"?"Inizia quest":"<svg viewBox=\"0 0 24 24\"><path d=\"M4 12l5 5L20 6\"/></svg>Ho fatto";
 $("skip").style.display=mode==="daily"?"none":"block";
 show("quest");const c=$("card");c.classList.remove("reveal");void c.offsetWidth;c.classList.add("reveal")}

$("daily").onclick=()=>{if(busy)return;const d=dailyState();
 if(d){if(d.state==="done")return;d.state==="active"?openProof():showQuest("daily");return}
 busy=true;animGen(()=>{const q=Rand.daily(S.recent),r=Rand.rarity();
  S.daily={date:day(),id:q.id,r:r.n,xp:r.xp,proof:q.proof,req:q.req,state:"assigned"};
  pushRecent(q.id);Store.save(S);busy=false;showQuest("daily")})};
function bonusGen(){if(busy)return;busy=true;animGen(()=>{const q=Rand.any(S.recent),r=Rand.rarity();
 bonus={id:q.id,r:r.n,xp:r.xp};pushRecent(q.id);Store.save(S);busy=false;showQuest("bonus")})}
$("go").onclick=bonusGen;$("skip").onclick=bonusGen;
$("ok").onclick=()=>qmode==="daily"?startDaily():finishBonus();

async function startDaily(){const d=dailyState();if(!d||d.state==="done")return;
 if(d.state==="active")return openProof();
 if(d.proof==="LOCATION"){try{d.origin=await Proof.pos()}catch(e){d.proof="HONOR";d.down=1}}
 d.state="active";d.startedAt=Date.now();Store.save(S);openProof()}

function openProof(){const d=dailyState(),q=QUESTS[d.id];stopProof();locOK=false;shot=null;
 $("plbl").textContent="Quest attiva · "+Proof.label[d.proof];$("pt").textContent=q.t;$("pp").textContent=q.d;
 const B=$("pbody");
 if(d.proof==="TIMER"){
  B.innerHTML="<div class=\"big\" id=\"tm\"></div><div class=\"bar2\"><i id=\"pb\"></i></div><p class=\"note\">Il timer va avanti anche se chiudi l’app. Puoi completare solo a tempo scaduto.</p><button class=\"cta\" id=\"pdone\" disabled>Completa</button>";
  const up=()=>{const l=Proof.timerLeft(d),s=Math.ceil(l/1000);$("tm").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
   $("pb").style.width=(100-l/(d.req*10))+"%";$("pdone").disabled=l>0;if(l<=0)clearInterval(tick)};
  up();tick=setInterval(up,500);$("pdone").onclick=()=>finishDaily({})}
 else if(d.proof==="PHOTO"){
  B.innerHTML="<div class=\"pv\" id=\"pv\">Scatta una foto come prova.</div><input type=\"file\" id=\"fi\" accept=\"image/*\" capture=\"environment\" hidden><button class=\"cta\" id=\"pshot\">Scatta prova</button><button class=\"cta\" id=\"pdone\" hidden>Conferma prova</button><p class=\"note\">La foto resta sul tuo telefono e non viene pubblicata. È una prova ragionevole, non una verifica sicura.</p>";
  $("pshot").onclick=()=>$("fi").click();
  $("fi").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{shot=await Proof.shrink(f)}catch(x){return}
   $("pv").innerHTML="<img src=\""+shot+"\">";$("pshot").textContent="Rifai foto";$("pdone").hidden=false};
  $("pdone").onclick=()=>finishDaily({photo:shot})}
 else if(d.proof==="LOCATION"){
  B.innerHTML="<div class=\"big\" id=\"ds\">— m</div><p class=\"note\">Devi arrivare a "+d.req+" m dal punto di partenza. La posizione serve solo a questa quest e viene cancellata a fine quest.</p><button class=\"cta\" id=\"pdone\" disabled>Completa</button>";
  watch=navigator.geolocation.watchPosition(p=>{const m=Math.round(Proof.dist(d.origin,{lat:p.coords.latitude,lon:p.coords.longitude}));
   locOK=m>=d.req&&p.coords.accuracy<150;$("ds").textContent=m+" / "+d.req+" m";$("pdone").disabled=!locOK},
   ()=>{$("ds").textContent="Posizione non disponibile"},{enableHighAccuracy:true});
  $("pdone").onclick=()=>finishDaily({})}
 else{
  B.innerHTML=(d.down?"<p class=\"note\">Non è stato possibile usare la posizione: questa quest passa a Honor System.</p>":"")+"<div class=\"box\"><b class=\"mono\">Honor system</b><br>Questa quest non può essere verificata automaticamente. Dà XP ma non conta per la classifica.</div><button class=\"cta\" id=\"pdone\">Ho fatto</button>";
  $("pdone").onclick=()=>finishDaily({})}
 show("proof")}

function finishDaily(x){const d=dailyState();if(!d||d.state!=="active")return;
 if(d.proof==="TIMER"&&Proof.timerLeft(d)>0)return;
 if(d.proof==="LOCATION"&&!locOK)return;
 if(d.proof==="PHOTO"&&!x.photo)return;
 const q=QUESTS[d.id],ver=Proof.verified(d.proof),r=R(d.r),ph=d.date+"-"+d.id;
 d.state="done";d.doneAt=Date.now();delete d.origin;
 if(d.proof==="PHOTO")Store.savePhoto(ph,x.photo);
 XP.add(S,d.xp);Streak.hit(S.st);if(ver)Streak.hit(S.vs);
 S.log=[{k:"daily",t:q.t,r:d.r,c:r.c,xp:d.xp,proof:d.proof,ver,ph:d.proof==="PHOTO"?ph:null,at:d.doneAt},...S.log].slice(0,60);
 Sync.queue(S,{type:"DAILY_COMPLETED",date:d.date,questId:d.id,proof:d.proof,verified:ver,startedAt:d.startedAt,completedAt:d.doneAt});
 Store.save(S);celebrate(d.xp,r.c,"Streak "+Streak.cur(S.st)+(ver?"":" · honor"))}
function finishBonus(){if(!bonus)return;const b=bonus,q=QUESTS[b.id],r=R(b.r);bonus=null;
 XP.add(S,b.xp);S.log=[{k:"bonus",t:q.t,r:b.r,c:r.c,xp:b.xp,at:Date.now()},...S.log].slice(0,60);
 Store.save(S);celebrate(b.xp,r.c,"Bonus completata")}

function burst(c){const d=$("done");d.style.setProperty("--rc",c);d.querySelectorAll(".pc,.ring").forEach(e=>e.remove());
 for(let i=0;i<2;i++){const r=document.createElement("i");r.className="ring";r.style.animationDelay=(i*.15)+"s";d.appendChild(r)}
 const cols=["#B8FF2C",c,"#F2F0EA","#4D7CFF"];
 for(let i=0;i<40;i++){const p=document.createElement("i");p.className="pc";const a=Math.random()*6.283,ds=110+Math.random()*170;
  p.style.setProperty("--x",Math.cos(a)*ds+"px");p.style.setProperty("--y",(Math.sin(a)*ds-40)+"px");
  p.style.setProperty("--r",(Math.random()*720-360)+"deg");p.style.setProperty("--pc",cols[i%4]);
  p.style.animationDelay=(.15+Math.random()*.1)+"s";d.appendChild(p)}}
function countUp(n){const el=$("plus"),t0=performance.now();
 (function f(t){const k=Math.min((t-t0)/700,1);el.textContent="+"+Math.round(n*(1-Math.pow(1-k,3)))+" XP";if(k<1)requestAnimationFrame(f)})(t0)}
function celebrate(xp,c,lab){$("doneLbl").textContent="Quest completata · "+lab;$("plus").textContent="+0 XP";$("done").classList.add("on");burst(c);countUp(xp);
 if(navigator.vibrate)navigator.vibrate([30,40,60]);
 setTimeout(()=>{$("done").classList.remove("on");show("home");stats(true)},1900)}

function renderLog(){const el=$("logList"),ph=Store.photos();
 if(!S.log.length){el.innerHTML="<h3>Quest log</h3><div class=\"empty mono\">Nessuna quest completata.</div>";return}
 el.innerHTML="<h3>Quest log</h3><div class=\"mono dim\">"+S.done+" completate · best streak "+S.st.b+"</div>"+S.log.map(l=>{
  const tag=l.k==="bonus"?["BONUS","#8b8b90"]:l.ver?["PROVA "+Proof.label[l.proof].toUpperCase(),"#B8FF2C"]:["HONOR","#FFB020"];
  return "<div class=\"it\"><i class=\"dot\" style=\"background:"+l.c+"\"></i><div><b>"+l.t+"</b><small>"+new Date(l.at).toLocaleDateString("it-IT",{day:"numeric",month:"short"})+" · "+l.r+"<span class=\"tg\" style=\"color:"+tag[1]+"\">"+tag[0]+"</span></small></div>"+(ph[l.ph]?"<img class=\"thumb\" src=\""+ph[l.ph]+"\">":"")+"<span style=\"color:"+l.c+"\">+"+l.xp+"</span></div>"}).join("")}
function renderFr(){const rows=[{n:"Tu",s:Streak.cur(S.vs),b:S.vs.b},...S.friends.map(f=>({n:esc(f.name),s:f.streak,b:f.best}))].sort((a,b)=>(b.s??-1)-(a.s??-1));
 $("frList").innerHTML="<h3>Friends</h3><div class=\"mono dim\">Streak corrente · conta solo Daily verificate</div>"+
  rows.map(r=>"<div class=\"it\"><div><b>"+r.n+"</b><small>best "+(r.b??"—")+"</small></div><span style=\"color:#B8FF2C;font-size:18px\">🔥 "+(r.s??"—")+"</span></div>").join("")+
  "<div class=\"mono dim\" style=\"margin-top:22px\">Il tuo codice</div><div class=\"code\" id=\"mycode\">"+Friends.code(S)+"</div>"+
  "<div class=\"mono dim\">Aggiungi amico</div><input id=\"fc\" placeholder=\"SQ-XXXXX\"><input id=\"fn\" placeholder=\"Nome (opzionale)\"><button class=\"cta ghost mono\" id=\"fadd\">Aggiungi</button>"+
  "<p class=\"note\" id=\"fmsg\">Le streak degli amici compariranno quando sarà attiva la sincronizzazione online (non ancora). Eventi in attesa: "+Sync.pending(S)+".</p>";
 $("mycode").onclick=()=>{try{navigator.clipboard.writeText(S.code)}catch(e){}};
 $("fadd").onclick=()=>{if(Friends.add(S,$("fc").value,$("fn").value)){Store.save(S);renderFr()}else $("fmsg").textContent="Codice non valido o già aggiunto."}}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.v));
renderHome();
</script>
